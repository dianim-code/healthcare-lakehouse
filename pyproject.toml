[project]
name = "healthcare-lakehouse"
version = "0.1.0"
description = "PySpark medallion pipeline (bronze, silver, gold) for Italian hospital beds and population."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "healthcare_lakehouse"

# Spark backend: exactly one of the two groups is installed. They cannot be installed together.
[dependency-groups]
local = ["pyspark>=4.0,<5"]
databricks = ["databricks-connect>=19.3,<20"]
dev = [
    "pytest>=8.3",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
]

[tool.uv]
default-groups = ["dev"]
conflicts = [[{ group = "local" }, { group = "databricks" }]]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
