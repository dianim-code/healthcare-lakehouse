# Run once:  uvx pre-commit install
# Run all:   uvx pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(csv|md)$
      - id: end-of-file-fixer
        exclude: \.csv$
      - id: check-yaml
        args: [--unsafe]   # bundle YAML may use custom tags
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.csv$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
